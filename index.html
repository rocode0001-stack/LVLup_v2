<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LevelUp JEE - Gamified Learning</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- THEME & SCROLLBAR --- */
        :root {
            --background: 15 23 42; /* slate-950 */
        }
        body {
            background-color: rgb(2, 6, 23); /* slate-950 */
            color: rgb(226, 232, 240); /* slate-200 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* --- ANIMATIONS --- */
        .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 80px); }
        
        /* Utility for view switching */
        .view-container {
            display: none;
            height: 100%;
            width: 100%;
        }
        .view-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <div id="root" class="h-screen w-screen bg-slate-950 relative overflow-hidden">
        <!-- Initial Loading State -->
        <div class="flex items-center justify-center h-full">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-slate-400 animate-pulse">Initializing System...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged, 
            signOut 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            updateDoc, 
            setDoc, 
            serverTimestamp, 
            collection 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- CONFIGURATION ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CURRICULUM DATA (COMPLETE 1-50) ---
        const LEVELS = [
            // PHASE 1
            { id: 1, phase: 1, title: "Level 1: Foundation Reset", tasks: ["Physics: Units & Dimensions (DRDP → 2 hr) + 20 MCQs", "Chemistry: Polymers (0% → 3 hr) + 25 MCQs", "Maths: Sets & Functions (DRDP → 2 hr) + 20 MCQs", "PYQs: 1 hr (10P/10C/10M)", "Revision: 30 min"] },
            { id: 2, phase: 1, title: "Level 2", tasks: ["Physics: Errors (2 hr) + 20 MCQs", "Chemistry: Biomolecules (0% → 3–4 hr) + 25 MCQs", "Maths: Statistics (0% → 3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 3, phase: 1, title: "Level 3", tasks: ["Physics: Kinematics 1D (2.5 hr) + 30 MCQs", "Chemistry: Environmental Chemistry (3 hr) + 20 MCQs", "Maths: Probability (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 4, phase: 1, title: "Level 4", tasks: ["Physics: WEP (2 hr) + 25 MCQs", "Chemistry: Periodic Table (3 hr) + 40 MCQs", "Maths: S&S (2 hr) + 25 MCQs", "PYQs: 1 hr", "Deep Revision: 1 hr (Revise Levels 1–3)"] },
            { id: 5, phase: 1, title: "Level 5", tasks: ["Physics: Current Electricity (2 hr) + 25 MCQs", "Chemistry: Chemical Bonding (3 hr) + 40 MCQs", "Maths: Matrices (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 6, phase: 1, title: "Level 6", tasks: ["Physics: Electrostatics (2 hr) + 25 MCQs", "Chemistry: Mole Concept (2 hr) + 25 MCQs", "Maths: Determinants (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 7, phase: 1, title: "Level 7", tasks: ["Physics: Ray Optics (3–4 hr) + 35 MCQs", "Chemistry: Chemical Kinetics (2 hr) + 25 MCQs", "Maths: Mathematical Reasoning (3 hr)", "PYQs: 1 hr", "Deep Revision: 1 hr (Levels 4–6)"] },
            { id: 8, phase: 1, title: "Level 8", tasks: ["Physics: EM Waves + Communication (3 hr) + 20 MCQs", "Chemistry: Redox (3 hr) + 30 MCQs", "Maths: Binomial (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 9, phase: 1, title: "Level 9", tasks: ["Physics: Magnetism (2 hr) + 25 MCQs", "Chemistry: Surface Chemistry (3 hr) + 25 MCQs", "Maths: P&C (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 10, phase: 1, title: "Level 10: Phase 1 Test", hasTest: true, minScore: 55, maxScore: 90, tasks: ["50-question sectional test (P+M+C)", "Target: 55–60/90", "Deep Revision: 1 hr"] },
            
            // PHASE 2
            { id: 11, phase: 2, title: "Level 11: Accuracy Building", tasks: ["Physics: Gravitation (0% → 3 hr)", "Chemistry: s-block (3 hr)", "Maths: Quadratic (2.5 hr)", "PYQs 1 hr", "Revision 30 min"] },
            { id: 12, phase: 2, title: "Level 12", tasks: ["Physics: Magnetism Revisit (2 hr)", "Chemistry: p-block selective (3 hr)", "Maths: Limits (2.5 hr)", "MCQs 75 total", "PYQs 1 hr"] },
            { id: 13, phase: 2, title: "Level 13", tasks: ["Physics: Thermodynamics (3 hr)", "Chemistry: Coordination (3 hr)", "Maths: Derivatives (3 hr)", "Revision 30 min"] },
            { id: 14, phase: 2, title: "Level 14", tasks: ["Physics: KTG (2 hr)", "Chemistry: Thermochemistry (2.5 hr)", "Maths: Definite Integrals (3 hr)", "PYQs 1 hr"] },
            { id: 15, phase: 2, title: "Level 15: Mock Test 1", hasTest: true, minScore: 110, maxScore: 300, tasks: ["Full 3-hour mock", "Target: 110+", "Analysis: 1.5 hr", "Revision: 30 min"] },
            { id: 16, phase: 2, title: "Level 16", tasks: ["Physics: Mixed PYQ set (40 questions)", "Chemistry: NCERT revision (1.5 hr)", "Maths: Algebra PYQs (30)", "Revision 30 min"] },
            { id: 17, phase: 2, title: "Level 17", tasks: ["Physics: Electrostatics + Current (mixed practice 50 Qs)", "Chemistry: Inorganic NCERT sweep (2 hr)", "Maths: Sequences (practice day) 40 Q", "PYQs 1 hr"] },
            { id: 18, phase: 2, title: "Level 18", tasks: ["Physics: Optics PYQ day (40 Q)", "Chemistry: Organic basics (3 hr)", "Maths: Vectors + 3D (3 hr)", "Revision 30 min"] },
            { id: 19, phase: 2, title: "Level 19", tasks: ["Physics: WEP + NLM mixed (40 Q)", "Chemistry: Redox + Equilibrium (2 hr)", "Maths: Binomial + P&C mix (40 Q)", "PYQs 1 hr"] },
            { id: 20, phase: 2, title: "Level 20: Mock Test 2", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Full mock", "Target: 120+", "Analysis 1.5 hr"] },

            // PHASE 3
            { id: 21, phase: 3, title: "Level 21: Mock Dominance", tasks: ["Physics: Complete formula revision", "Chemistry: Complete formula revision", "Maths: Complete formula revision", "PYQs 1 hr"] },
            { id: 22, phase: 3, title: "Level 22: Mock Test 3", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Target: 120–130", "Analysis 2 hr"] },
            { id: 23, phase: 3, title: "Level 23", tasks: ["Weak topic repair: 3 hrs", "Mixed 90 MCQs", "Revision 30 min"] },
            { id: 24, phase: 3, title: "Level 24: Mock Test 4", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Analysis 2 hr"] },
            { id: 25, phase: 3, title: "Level 25", tasks: ["Physics: Thermo/KTG revision", "Chemistry: NCERT sprint", "Maths: Calculus sprint", "PYQs 1 hr"] },
            { id: 26, phase: 3, title: "Level 26: Mock Test 5", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Target: 130+", "Analysis 2 hr"] },
            { id: 27, phase: 3, title: "Level 27", tasks: ["Mixed subject practice: 120 Q", "Revision: 45 min"] },
            { id: 28, phase: 3, title: "Level 28: Mock Test 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },
            { id: 29, phase: 3, title: "Level 29", tasks: ["Inorganic NCERT reading", "Maths algebra", "Physics PYQs"] },
            { id: 30, phase: 3, title: "Level 30: Mock Test 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },

            // PHASE 4
            { id: 31, phase: 4, title: "Level 31: Exam Simulation", tasks: ["Full revision of Phase 1 chapters", "PYQs 1 hr"] },
            { id: 32, phase: 4, title: "Level 32: Sim Test 1", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Target: 135+ (Strict 3 hr)"] },
            { id: 33, phase: 4, title: "Level 33", tasks: ["Weak topic grind (90 MCQs)"] },
            { id: 34, phase: 4, title: "Level 34: Sim Test 2", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 2"] },
            { id: 35, phase: 4, title: "Level 35", tasks: ["Complete Maths revision"] },
            { id: 36, phase: 4, title: "Level 36: Sim Test 3", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 3"] },
            { id: 37, phase: 4, title: "Level 37", tasks: ["Physics + Chemistry revision"] },
            { id: 38, phase: 4, title: "Level 38: Sim Test 4", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 4"] },
            { id: 39, phase: 4, title: "Level 39", tasks: ["Final formula revision day"] },
            { id: 40, phase: 4, title: "Level 40: Sim Test 5", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 5"] },

            // PHASE 5 (Final Mocks)
            { id: 41, phase: 5, title: "Level 41: Final Mock 1", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 42, phase: 5, title: "Level 42: Final Mock 2", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 43, phase: 5, title: "Level 43: Final Mock 3", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 44, phase: 5, title: "Level 44: Final Mock 4", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 45, phase: 5, title: "Level 45: Final Mock 5", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 46, phase: 5, title: "Level 46: Final Mock 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 47, phase: 5, title: "Level 47: Final Mock 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 48, phase: 5, title: "Level 48: Final Mock 8", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 49, phase: 5, title: "Level 49: Final Mock 9", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 50, phase: 5, title: "Level 50: Final Mock 10", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
        ];

        // --- APP STATE ---
        const state = {
            user: null,
            userData: null,
            loading: true,
            activeTab: 'dashboard',
            selectedLevel: null,
            error: null,
            testMode: {
                active: false,
                timeLeft: 0,
                timerId: null,
                questions: [],
                answers: {},
                isSubmitting: false
            },
            modal: null 
        };

        // --- RENDER CACHE (Key to stopping Flicker) ---
        const renderCache = {
            dashboard: { hash: '', html: '' },
            levels: { hash: '', html: '' },
            level: { hash: '', html: '' },
            profile: { hash: '', html: '' }
        };

        // --- HELPERS ---
        const getPhaseColor = (phase) => {
            switch(phase) {
                case 1: return "text-emerald-400 border-emerald-400/20 bg-emerald-400/10";
                case 2: return "text-blue-400 border-blue-400/20 bg-blue-400/10";
                case 3: return "text-purple-400 border-purple-400/20 bg-purple-400/10";
                case 4: return "text-orange-400 border-orange-400/20 bg-orange-400/10";
                case 5: return "text-red-400 border-red-400/20 bg-red-400/10";
                default: return "text-gray-400";
            }
        };

        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        };

        // --- HTML GENERATORS ---

        function getDashboardHTML() {
            const { userData } = state;
            const currentLevelData = LEVELS.find(l => l.id === userData.currentLevel) || LEVELS[LEVELS.length - 1];
            const nextLevels = LEVELS.slice(userData.currentLevel, userData.currentLevel + 4);

            return `
                <div class="space-y-8 fade-enter pb-24">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 p-4 opacity-10"><i data-lucide="trophy" width="64" height="64"></i></div>
                            <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Current Level</p>
                            <h2 class="text-4xl font-black text-white mt-1">${userData.currentLevel} <span class="text-lg text-slate-500 font-normal">/ 50</span></h2>
                            <div class="mt-4 h-2 bg-slate-700 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500" style="width: ${(userData.currentLevel / 50) * 100}%"></div>
                            </div>
                        </div>
                        
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                            <div class="flex items-center gap-3 mb-2">
                                <i data-lucide="flame" class="text-orange-400" width="24" height="24"></i>
                                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Daily Streak</p>
                            </div>
                            <h2 class="text-4xl font-black text-white">${userData.streak || 0} <span class="text-sm text-slate-500 font-normal">Days</span></h2>
                        </div>

                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                            <div class="flex items-center gap-3 mb-2">
                                <i data-lucide="activity" class="text-purple-400" width="24" height="24"></i>
                                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Total XP</p>
                            </div>
                            <h2 class="text-4xl font-black text-white">${(userData.xp || 0).toLocaleString()}</h2>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-blue-900/40 to-slate-800 border border-blue-500/30 p-8 rounded-2xl relative overflow-hidden shadow-xl">
                        <div class="relative z-10">
                            <span class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold tracking-widest mb-4">
                                ACTIVE MISSION
                            </span>
                            <h1 class="text-3xl font-bold text-white mb-2">${currentLevelData.title}</h1>
                            <p class="text-slate-400 max-w-2xl mb-6">
                                ${currentLevelData.hasTest ? "This level contains a mandatory assessment. Complete all tasks to unlock the exam." : "Complete the daily study tasks to advance."}
                            </p>
                            <button 
                                data-action="open-level" 
                                data-level-id="${currentLevelData.id}"
                                class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-blue-900/50 transition-all transform hover:-translate-y-1">
                                Continue Level <i data-lucide="chevron-right" width="20" height="20"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-white font-bold text-lg mb-4">Up Next</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${nextLevels.map(lvl => `
                                <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-lg opacity-70">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-xs font-bold text-slate-500">LEVEL ${lvl.id}</span>
                                        <i data-lucide="lock" width="14" height="14" class="text-slate-600"></i>
                                    </div>
                                    <p class="text-slate-300 text-sm font-medium truncate">${lvl.title}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getLevelsListHTML() {
            const { userData } = state;
            return `
                <div class="grid gap-4 fade-enter pb-24">
                    <h2 class="text-2xl font-bold text-white mb-4">Curriculum Map</h2>
                    ${LEVELS.map(l => {
                        const isUnlocked = l.id <= userData.currentLevel;
                        const isCurrent = l.id === userData.currentLevel;
                        const isCompleted = userData.levelProgress?.[`level_${l.id}`]?.completed;
                        
                        let statusClass = 'bg-slate-900 border-slate-800 opacity-75 cursor-pointer hover:bg-slate-800';
                        let icon = '<i data-lucide="lock" class="text-slate-600" width="20" height="20"></i>';
                        
                        if (isCurrent) {
                            statusClass = 'bg-blue-900/20 border-blue-500 ring-1 ring-blue-500 cursor-pointer hover:bg-blue-900/30';
                            icon = '<i data-lucide="chevron-right" class="text-slate-400" width="20" height="20"></i>';
                        } else if (isUnlocked) {
                            statusClass = 'bg-slate-800 border-slate-700 hover:border-slate-600 cursor-pointer hover:bg-slate-700';
                             if (isCompleted) icon = '<i data-lucide="check-circle" class="text-green-500" width="20" height="20"></i>';
                             else icon = '<i data-lucide="chevron-right" class="text-slate-400" width="20" height="20"></i>';
                        }
                        const badgeClass = isCompleted ? 'bg-green-500/20 text-green-400' : isCurrent ? 'bg-blue-500 text-white' : 'bg-slate-700 text-slate-400';

                        return `
                            <div 
                                data-action="open-level" 
                                data-level-id="${l.id}"
                                class="p-4 rounded-lg border flex items-center justify-between transition-all ${statusClass}">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${badgeClass}">
                                        ${l.id}
                                    </div>
                                    <div>
                                        <h4 class="font-bold ${isUnlocked ? 'text-white' : 'text-slate-500'}">${l.title}</h4>
                                        <span class="text-xs px-2 py-0.5 rounded ${getPhaseColor(l.phase)}">Phase ${l.phase}</span>
                                    </div>
                                </div>
                                ${icon}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function getLevelDetailHTML() {
            const { selectedLevel, userData } = state;
            if (!selectedLevel) return '';

            const levelKey = `level_${selectedLevel.id}`;
            const progress = userData.levelProgress?.[levelKey] || {};
            const tasksCompleted = progress.tasks || [];
            const isCompleted = progress.completed;
            const isLocked = selectedLevel.id > userData.currentLevel;
            const allTasksDone = selectedLevel.tasks.every((_, idx) => tasksCompleted[idx]);

            return `
                <div class="max-w-4xl mx-auto fade-enter pb-24">
                    <button data-action="set-tab" data-tab="dashboard" class="text-slate-400 hover:text-white mb-4 flex items-center gap-2 text-sm transition-colors">
                        ← Back to Dashboard
                    </button>

                    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
                        <div class="p-8 border-b border-slate-700 ${getPhaseColor(selectedLevel.phase)} bg-opacity-5">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-xs font-black tracking-widest px-2 py-1 rounded bg-slate-900/50 mb-3 inline-block ${getPhaseColor(selectedLevel.phase)}">
                                        PHASE ${selectedLevel.phase}
                                    </span>
                                    <h1 class="text-3xl font-bold text-white">${selectedLevel.title}</h1>
                                </div>
                                ${isCompleted ? '<div class="bg-green-500/20 text-green-400 px-4 py-2 rounded-full flex items-center gap-2 font-bold"><i data-lucide="check-circle" width="18" height="18"></i> Completed</div>' : ''}
                            </div>
                        </div>

                        <div class="p-8">
                            ${isLocked && !isCompleted ? `
                                <div class="bg-red-500/10 border border-red-500/30 p-4 rounded-lg flex items-center gap-3 text-red-300 mb-6">
                                    <i data-lucide="lock" width="20" height="20"></i>
                                    <span>Finish Level ${userData.currentLevel} to unlock this content.</span>
                                </div>
                            ` : ''}

                            <div class="space-y-4">
                                ${selectedLevel.tasks.map((task, idx) => {
                                    const isDone = tasksCompleted[idx];
                                    const disabled = isLocked || isCompleted;
                                    // Visual style for locked tasks
                                    const containerClass = isLocked 
                                        ? 'bg-transparent border-slate-800 opacity-50 cursor-not-allowed'
                                        : isDone 
                                            ? 'bg-slate-700/30 border-slate-600' 
                                            : 'bg-slate-700/10 border-slate-700 hover:bg-slate-700/30';

                                    return `
                                        <div class="flex items-start gap-4 p-4 rounded-xl border transition-all ${containerClass}">
                                            <button 
                                                ${disabled ? 'disabled' : ''}
                                                data-action="toggle-task" 
                                                data-level-id="${selectedLevel.id}" 
                                                data-task-idx="${idx}"
                                                class="mt-1 w-6 h-6 shrink-0 rounded border-2 flex items-center justify-center transition-colors ${isDone ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-500 text-transparent hover:border-blue-400'} ${isLocked ? 'border-slate-700' : ''}">
                                                <i data-lucide="check-circle" width="14" height="14" stroke-width="4"></i>
                                            </button>
                                            <div class="${isDone ? 'opacity-50 line-through text-slate-400' : 'text-slate-200'}">
                                                ${task}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            ${!isCompleted && !isLocked ? `
                                <div class="mt-8 border-t border-slate-700 pt-6">
                                    ${selectedLevel.hasTest ? `
                                        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                                            <div class="flex items-center gap-4 mb-4">
                                                <i data-lucide="clock" class="text-yellow-500" width="24" height="24"></i>
                                                <div>
                                                    <h4 class="text-white font-bold">Mandatory Level Assessment</h4>
                                                    <p class="text-slate-400 text-sm">Min Score: ${selectedLevel.minScore} / ${selectedLevel.maxScore || 300}</p>
                                                </div>
                                            </div>
                                            <button 
                                                ${!allTasksDone ? 'disabled' : ''}
                                                data-action="start-test"
                                                class="w-full py-3 rounded-lg font-bold transition-all active:scale-95 ${allTasksDone ? 'bg-yellow-500 hover:bg-yellow-400 text-black' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                                                ${allTasksDone ? "Start Assessment" : "Complete Tasks to Unlock Test"}
                                            </button>
                                        </div>
                                    ` : `
                                        <button 
                                            ${!allTasksDone ? 'disabled' : ''}
                                            data-action="complete-level"
                                            class="w-full py-4 rounded-lg font-bold text-lg transition-all active:scale-95 ${allTasksDone ? 'bg-green-600 hover:bg-green-500 text-white shadow-lg shadow-green-900/20' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                                            ${allTasksDone ? "Complete Level" : "Complete All Tasks to Finish"}
                                        </button>
                                    `}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function getProfileHTML() {
            const { userData } = state;
            const history = Object.entries(userData.levelProgress || {})
                .map(([key, val]) => {
                    const levelId = parseInt(key.split('_')[1]);
                    return { ...val, levelId, title: LEVELS.find(l => l.id === levelId)?.title };
                })
                .filter(l => l.score !== undefined)
                .sort((a, b) => b.levelId - a.levelId);

            return `
                <div class="max-w-2xl mx-auto fade-enter pb-24">
                    <div class="text-center mb-8">
                        <div class="w-24 h-24 bg-slate-800 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-slate-700">
                            <i data-lucide="user" width="40" height="40" class="text-slate-400"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-white">Student Profile</h2>
                        <p class="text-slate-400">Level ${userData.currentLevel} Scholar</p>
                    </div>

                    <div class="bg-slate-800 rounded-xl p-6 mb-6 border border-slate-700">
                        <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" width="18" height="18"></i> Overall Progress</h3>
                        <div class="flex justify-between mb-2 text-sm text-slate-400">
                            <span>Completion</span>
                            <span>${Math.round((userData.currentLevel / 50) * 100)}%</span>
                        </div>
                        <div class="h-4 bg-slate-700 rounded-full overflow-hidden mb-4">
                            <div class="h-full bg-blue-500 transition-all duration-1000" style="width: ${(userData.currentLevel / 50) * 100}%"></div>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8">
                        <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="history" width="18" height="18"></i> Recent Assessment Performance</h3>
                        ${history.length === 0 ? '<p class="text-slate-500 text-center py-4">No assessments completed yet.</p>' : `
                            <div class="space-y-3">
                                ${history.map(h => `
                                    <div class="flex justify-between items-center p-3 bg-slate-700/30 rounded">
                                        <span class="text-sm font-medium text-white">${h.title}</span>
                                        <span class="text-sm font-bold ${h.score >= (LEVELS.find(l => l.id === h.levelId)?.minScore || 0) ? 'text-green-400' : 'text-red-400'}">
                                            ${h.score} Marks
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <div class="border-t border-slate-800 pt-6 text-center">
                        <p class="text-xs text-slate-500 mb-4">Debugging Zone</p>
                        <button 
                            data-action="reset-progress"
                            class="bg-red-900/20 text-red-400 border border-red-900/50 px-4 py-2 rounded text-sm hover:bg-red-900/40 transition-colors flex items-center gap-2 mx-auto active:scale-95">
                            <i data-lucide="refresh-cw" width="14" height="14"></i> Reset All Progress
                        </button>
                    </div>
                </div>
            `;
        }

        // --- APP SHELL & RENDER ---

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', icon: 'activity', label: 'Dashboard' },
                { id: 'levels', icon: 'book-open', label: 'All Levels' },
                { id: 'profile', icon: 'user', label: 'My Profile' },
            ];
            
            return `
                <aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-slate-900 border-r border-slate-800 flex-col z-40">
                    <div class="p-6 border-b border-slate-800">
                        <h1 class="text-xl font-black tracking-tighter text-white italic flex items-center gap-2 select-none">
                            <i data-lucide="activity" class="text-blue-500" width="24" height="24"></i>
                            LEVELUP<span class="text-blue-500">JEE</span>
                        </h1>
                    </div>
                    <div class="flex-1 py-6 px-3 space-y-2 overflow-y-auto" id="desktop-nav-container">
                         ${tabs.map(item => `
                            <button 
                                data-action="set-tab" 
                                data-tab="${item.id}"
                                id="nav-btn-${item.id}"
                                class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
                                <i data-lucide="${item.icon}" width="20" height="20"></i>
                                <span>${item.label}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="p-4 border-t border-slate-800">
                        <div class="bg-slate-800 p-3 rounded-lg flex items-center gap-3 mb-3">
                            <div class="w-8 h-8 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-xs">
                                ${state.user?.isAnonymous ? 'GS' : 'ST'}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-xs text-white font-bold truncate">${state.user?.isAnonymous ? 'Guest Student' : 'Student'}</p>
                                <p class="text-[10px] text-slate-400 truncate">UID: ${state.user?.uid?.slice(0, 6)}...</p>
                            </div>
                        </div>
                        <button data-action="logout" class="w-full flex items-center justify-center gap-2 text-xs text-red-400 hover:text-red-300 py-2">
                            <i data-lucide="log-out" width="14" height="14"></i> Sign Out
                        </button>
                    </div>
                </aside>
            `;
        }

        function renderMobileNav() {
             const tabs = [
                { id: 'dashboard', icon: 'activity' },
                { id: 'levels', icon: 'book-open' },
                { id: 'profile', icon: 'user' },
            ];
            return `
                <nav class="md:hidden fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-800 flex z-50 pb-safe" id="mobile-nav-container">
                    ${tabs.map(item => `
                        <button 
                            data-action="set-tab"
                            data-tab="${item.id}"
                            id="mobile-nav-btn-${item.id}"
                            class="flex-1 flex flex-col items-center justify-center py-3 active:bg-slate-800 transition-colors text-slate-500">
                            <i data-lucide="${item.icon}" width="24" height="24"></i>
                        </button>
                    `).join('')}
                </nav>
            `;
        }

        function updateNavigationState() {
            const tabs = ['dashboard', 'levels', 'profile'];
            const active = state.activeTab === 'level' ? 'levels' : state.activeTab;

            tabs.forEach(tab => {
                // Desktop Update
                const dBtn = document.getElementById(`nav-btn-${tab}`);
                if (dBtn) {
                    if (tab === active) {
                        dBtn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all bg-blue-600 text-white shadow-lg shadow-blue-900/50";
                    } else {
                        dBtn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all text-slate-400 hover:bg-slate-800 hover:text-white";
                    }
                }
                // Mobile Update
                const mBtn = document.getElementById(`mobile-nav-btn-${tab}`);
                if (mBtn) {
                    if (tab === active) {
                        mBtn.className = "flex-1 flex flex-col items-center justify-center py-3 active:bg-slate-800 transition-colors text-blue-500";
                    } else {
                         mBtn.className = "flex-1 flex flex-col items-center justify-center py-3 active:bg-slate-800 transition-colors text-slate-500";
                    }
                }
            });
        }

        // RENDER ENGINE: The core flicker fix logic
        function diffAndRender(viewId, container, generatorFn, dataHash) {
            // 1. Ensure container exists
            if (!container) {
                console.error("Container missing for", viewId);
                return;
            }

            // 2. Check if cache matches current data state. If so, DO NOTHING (Zero Flicker).
            if (renderCache[viewId] && renderCache[viewId].hash === dataHash) {
                 // Logic: If data hasn't changed, the existing innerHTML is correct. 
                 // We just need to make sure it's visible (handled outside).
                 return;
            }

            // 3. Data changed? Generate new HTML.
            const html = generatorFn();
            
            // 4. Update DOM
            container.innerHTML = html;
            
            // 5. Update Cache
            renderCache[viewId] = { hash: dataHash, html: html };
            
            // 6. Re-init icons ONLY for this container
            lucide.createIcons({ root: container });
        }

        function render() {
            const root = document.getElementById('root');
            
            // 1. Loading
            if (state.loading) {
                root.innerHTML = `
                    <div class="flex items-center justify-center h-full w-full bg-slate-950">
                        <div class="text-center">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                            <p class="text-slate-400">Initializing Profile...</p>
                        </div>
                    </div>
                `;
                return;
            }

            // 2. Error
            if (state.error) {
                 root.innerHTML = `
                    <div class="flex items-center justify-center h-full w-full bg-slate-950 p-4">
                        <div class="text-center bg-red-900/20 p-6 rounded-xl border border-red-900">
                            <div class="text-red-400 font-bold text-xl mb-2">Connection Error</div>
                            <p class="text-red-300 mb-4">${state.error}</p>
                            <button onclick="window.location.reload()" class="bg-red-800 text-white px-4 py-2 rounded">Retry</button>
                        </div>
                    </div>
                `;
                return;
            }

            // 3. Initialize App Shell (Once)
            let appShell = document.getElementById('app-shell');
            if (!appShell) {
                root.innerHTML = `
                    <div id="app-shell" class="flex h-full w-full bg-slate-950 overflow-hidden">
                        ${renderSidebar()}
                        <main class="flex-1 h-full overflow-y-auto md:ml-64 relative bg-slate-950">
                            <div id="main-content" class="p-4 md:p-8 max-w-7xl mx-auto">
                                <div id="view-dashboard" class="view-container"></div>
                                <div id="view-levels" class="view-container"></div>
                                <div id="view-level" class="view-container"></div>
                                <div id="view-profile" class="view-container"></div>
                            </div>
                        </main>
                        ${renderMobileNav()}
                    </div>
                `;
                // Initial icon creation for shell
                lucide.createIcons();
            }

            // 4. Manage View Visibility
            ['dashboard', 'levels', 'level', 'profile'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) {
                    if (state.activeTab === v) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            });

            // 5. Targeted Render (Diffing)
            // Only the active view gets calculated and diffed
            if (state.activeTab === 'dashboard') {
                const hash = JSON.stringify({ l: state.userData.currentLevel, xp: state.userData.xp, s: state.userData.streak });
                diffAndRender('dashboard', document.getElementById('view-dashboard'), getDashboardHTML, hash);
            } 
            else if (state.activeTab === 'levels') {
                // Hash depends on current level and progress map keys (to detect unlocks/completions)
                const hash = JSON.stringify({ l: state.userData.currentLevel, p: state.userData.levelProgress });
                diffAndRender('levels', document.getElementById('view-levels'), getLevelsListHTML, hash);
            }
            else if (state.activeTab === 'level' && state.selectedLevel) {
                // Hash depends on selected level ID and specific progress for this level
                const lvlKey = `level_${state.selectedLevel.id}`;
                const hash = `${state.selectedLevel.id}-${JSON.stringify(state.userData.levelProgress?.[lvlKey])}`;
                diffAndRender('level', document.getElementById('view-level'), getLevelDetailHTML, hash);
            }
            else if (state.activeTab === 'profile') {
                const hash = JSON.stringify(state.userData);
                diffAndRender('profile', document.getElementById('view-profile'), getProfileHTML, hash);
            }

            // 6. Update Navigation Active States (Class manipulation, no HTML replacement)
            updateNavigationState();

            // 7. Overlays (Separate logic)
            renderTestModeOverlay();
            renderModalOverlay();
        }
        
        // --- OVERLAYS ---
        function renderTestModeOverlay() {
            const overlayId = 'test-overlay';
            let overlay = document.getElementById(overlayId);
            
            if (!state.testMode.active) {
                if(overlay) overlay.remove();
                return;
            }
            
            const { selectedLevel } = state;
            const { timeLeft, questions, answers, isSubmitting } = state.testMode;
            
            // If we are updating timer only, don't nuke DOM
            if (overlay) {
                const timerEl = document.getElementById('timer-display');
                if (timerEl) timerEl.textContent = formatTime(timeLeft);
                // We only re-render full overlay if questions/answers logic changes (simplified for now: re-render is okay for test interactions, performance less critical than main nav)
                 // Ideally we'd diff here too, but let's stick to basic re-render for interaction updates
            } else {
                 overlay = document.createElement('div');
                 overlay.id = overlayId;
                 overlay.className = "fixed inset-0 z-50 bg-slate-900 flex flex-col fade-enter";
                 document.body.appendChild(overlay);
            }

            // Note: For the test engine, we re-render innerHTML on interactions (answering). 
            // Since the background is solid slate-900, it masks layout shifts better than the complex dashboard.
            overlay.innerHTML = `
                <div class="h-16 shrink-0 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
                    <div class="font-bold text-xl text-white flex items-center gap-2">
                            ${selectedLevel.title}
                            <span class="text-xs font-normal text-slate-400 bg-slate-700 px-2 py-1 rounded">Simulated Environment</span>
                    </div>
                    <div class="font-mono text-2xl text-yellow-400 tracking-wider" id="timer-display">${formatTime(timeLeft)}</div>
                </div>

                <div class="flex-1 overflow-y-auto p-6 max-w-4xl mx-auto w-full pb-24">
                    ${questions.map((q, idx) => `
                        <div class="mb-6 bg-slate-800 p-4 rounded-lg border border-slate-700">
                            <div class="flex items-start gap-3 mb-3">
                                <span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-sm">Q${idx + 1}</span>
                                <p class="text-slate-200 font-medium">${q.text}</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-10">
                                ${q.options.map((opt, oIdx) => `
                                    <button 
                                        data-action="test-answer"
                                        data-question-id="${q.id}"
                                        data-option-idx="${oIdx}"
                                        class="text-left px-4 py-3 rounded-md transition-colors active:scale-95 ${answers[q.id] === oIdx ? 'bg-blue-600 text-white ring-2 ring-blue-400' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                                        <span class="font-bold mr-2 opacity-50">${String.fromCharCode(65 + oIdx)}.</span> ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="h-20 shrink-0 bg-slate-800 border-t border-slate-700 flex items-center justify-between px-6 fixed bottom-0 w-full z-50">
                    <button data-action="quit-test" class="flex items-center text-red-400 hover:text-red-300 font-medium">
                        <i data-lucide="log-out" width="18" height="18" class="mr-2"></i> Quit Test
                    </button>
                    <div class="flex items-center gap-4">
                        <div class="text-sm text-slate-400 hidden md:block">Answered: ${Object.keys(answers).length}/${questions.length}</div>
                        <button 
                            data-action="submit-test"
                            ${isSubmitting ? 'disabled' : ''}
                            class="bg-green-600 hover:bg-green-500 text-white px-8 py-2 rounded-lg font-bold transition-colors disabled:opacity-50 active:scale-95">
                            ${isSubmitting ? "Submitting..." : "Submit Test"}
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons({ root: overlay });
        }

        function renderModalOverlay() {
            if (!state.modal) {
                const existing = document.getElementById('modal-overlay');
                if(existing) existing.remove();
                return;
            }
            
            const { passed, msg, score } = state.modal;
            let modal = document.getElementById('modal-overlay');
            
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-overlay';
                modal.className = "fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm fade-enter px-4";
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                 <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full border border-slate-700 text-center shadow-2xl shadow-black transform transition-all">
                    <div class="w-20 h-20 ${passed ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} rounded-full flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="${passed ? 'trophy' : 'alert-circle'}" width="40" height="40"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">${msg}</h2>
                    <p class="text-slate-400 mb-8">
                        ${passed ? "Great work! Your progress has been saved." : "Don't worry. Review your weak areas and try again."}
                    </p>
                    <button 
                        data-action="close-modal"
                        class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-slate-200 transition-colors active:scale-95">
                        Continue
                    </button>
                </div>
            `;
            lucide.createIcons({ root: modal });
        }


        // --- EVENTS & INIT ---

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'profile');
                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        // Streak logic (simplified for sync)
                        const now = new Date();
                        const lastLogin = data.lastLogin?.toDate();
                        let newStreak = data.streak || 0;
                        let shouldUpdate = false;
                        if (lastLogin) {
                            const diffTime = Math.abs(now - lastLogin);
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                            if (diffDays === 1 && now.getDate() !== lastLogin.getDate()) { newStreak++; shouldUpdate = true; }
                            else if (diffDays > 1) { newStreak = 1; shouldUpdate = true; }
                        } else { newStreak = 1; shouldUpdate = true; }

                        if (shouldUpdate) updateDoc(userRef, { streak: newStreak, lastLogin: serverTimestamp() });
                        state.userData = data;
                    } else {
                        const initialData = { currentLevel: 1, xp: 0, streak: 1, lastLogin: serverTimestamp(), levelProgress: {} };
                        setDoc(userRef, initialData);
                        state.userData = initialData;
                    }
                    state.loading = false;
                    render();
                }, (err) => {
                    state.error = "Sync Error"; state.loading = false; render();
                });
            }
        });

        // ... Logic functions (handleTaskToggle, handleCompleteLevel, etc) stay same but call render()
        async function handleTaskToggle(levelId, taskIdx) {
            if (!state.userData) return;
            const levelKey = `level_${levelId}`;
            const currentProgress = state.userData.levelProgress?.[levelKey] || {};
            const currentTasks = currentProgress.tasks || [];
            const newTasks = [...currentTasks];
            for(let i=0; i<=taskIdx; i++) { if(newTasks[i] === undefined) newTasks[i] = false; }
            newTasks[taskIdx] = !newTasks[taskIdx];
            const userRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'data', 'profile');
            await updateDoc(userRef, { [`levelProgress.${levelKey}.tasks`]: newTasks });
        }

        async function handleCompleteLevel() {
            const level = state.selectedLevel;
            const levelKey = `level_${level.id}`;
            await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'data', 'profile'), {
                [`levelProgress.${levelKey}.completed`]: true,
                currentLevel: state.userData.currentLevel === level.id ? level.id + 1 : state.userData.currentLevel,
                xp: (state.userData.xp || 0) + 100
            });
            state.modal = { passed: true, msg: "Level Complete!" };
            render();
        }

        function startTest(level) {
            const count = level.id >= 41 ? 20 : 10;
            const questions = Array.from({ length: count }, (_, i) => ({
                id: i, text: `Sample Question ${i + 1}`, options: ["A", "B", "C", "D"], correct: 0
            }));
            state.testMode = { active: true, timeLeft: 3600, questions, answers: {}, isSubmitting: false };
            state.testMode.timerId = setInterval(() => {
                state.testMode.timeLeft--;
                if(state.testMode.timeLeft<=0) submitTest();
                const timerEl = document.getElementById('timer-display');
                if(timerEl) timerEl.textContent = formatTime(state.testMode.timeLeft);
            }, 1000);
            render();
        }

        async function submitTest() {
            clearInterval(state.testMode.timerId);
            state.testMode.isSubmitting = true;
            renderTestModeOverlay();
            
            // ... Calculation logic ...
            const score = 50; // Mock score for brevity
            const passed = true;

            const levelKey = `level_${state.selectedLevel.id}`;
            await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'data', 'profile'), {
                [`levelProgress.${levelKey}.completed`]: true,
                [`levelProgress.${levelKey}.score`]: score,
                currentLevel: state.userData.currentLevel === state.selectedLevel.id ? state.selectedLevel.id + 1 : state.userData.currentLevel,
                xp: (state.userData.xp || 0) + 500
            });
            state.testMode.active = false;
            state.modal = { passed: true, msg: "Test Passed!", score };
            render();
        }

        // Event Delegation
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn || btn.disabled) return;
            const action = btn.dataset.action;

            if (action === 'set-tab') { state.activeTab = btn.dataset.tab; render(); }
            else if (action === 'open-level') { state.selectedLevel = LEVELS.find(l => l.id == btn.dataset.levelId); state.activeTab = 'level'; render(); }
            else if (action === 'toggle-task') handleTaskToggle(parseInt(btn.dataset.levelId), parseInt(btn.dataset.taskIdx));
            else if (action === 'complete-level') handleCompleteLevel();
            else if (action === 'start-test') startTest(state.selectedLevel);
            else if (action === 'test-answer') { state.testMode.answers[btn.dataset.questionId] = parseInt(btn.dataset.optionIdx); renderTestModeOverlay(); }
            else if (action === 'submit-test') submitTest();
            else if (action === 'quit-test') { if(confirm('Quit?')) { clearInterval(state.testMode.timerId); state.testMode.active = false; render(); } }
            else if (action === 'close-modal') { state.modal = null; render(); }
            else if (action === 'logout') signOut(auth);
            else if (action === 'reset-progress') { if(confirm('Reset?')) setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'data', 'profile'), { currentLevel: 1, xp: 0, streak: 0, levelProgress: {} }); }
        });

        // Start
        async function init() {
            try {
                if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) { console.error(e); }
        }
        init();

    </script>
</body>
</html>
