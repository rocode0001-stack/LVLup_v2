<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUp JEE - Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.2s ease-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-blue-500/30 flex flex-col md:flex-row">

    <!-- --- SIDEBAR (Desktop) --- -->
    <nav class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-slate-900 border-r border-slate-800 flex-col z-40">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-black tracking-tighter text-white italic flex items-center gap-2">
                <i data-lucide="activity" class="text-blue-500"></i>
                LEVELUP<span class="text-blue-500">JEE</span>
            </h1>
        </div>
        <div class="flex-1 py-6 px-3 space-y-2" id="desktop-nav"></div>
        <div class="p-4 border-t border-slate-800">
            <div class="bg-slate-800 p-3 rounded-lg flex items-center gap-3 mb-3">
                <div class="w-8 h-8 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-xs">ST</div>
                <div class="overflow-hidden">
                    <p class="text-xs text-white font-bold truncate">Student</p>
                    <p class="text-[10px] text-slate-400 truncate">Local Mode</p>
                </div>
            </div>
            <button onclick="app.resetProgress()" class="w-full flex items-center justify-center gap-2 text-xs text-red-400 hover:text-red-300 py-2">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Reset Data
            </button>
        </div>
    </nav>

    <!-- --- BOTTOM NAV (Mobile) --- -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-800 flex z-40 pb-safe" id="mobile-nav"></nav>

    <!-- --- MAIN CONTENT --- -->
    <main class="flex-1 md:ml-64 p-4 pb-24 md:p-8 max-w-7xl mx-auto w-full relative min-h-screen">
        <div id="app-content">
            <!-- Content loads here -->
        </div>
    </main>

    <!-- --- MODALS --- -->
    <div id="test-engine" class="fixed inset-0 z-50 bg-slate-900 hidden flex-col animate-fade-in">
        <!-- Test Engine HTML generated by JS -->
    </div>

    <div id="result-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm hidden animate-fade-in px-4">
        <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full border border-slate-700 text-center">
            <div id="result-icon" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"></div>
            <h2 id="result-msg" class="text-2xl font-bold text-white mb-2"></h2>
            <p id="result-desc" class="text-slate-400 mb-8"></p>
            <button onclick="app.closeResult()" class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-slate-200 transition-colors">Continue</button>
        </div>
    </div>

    <!-- --- SCRIPT --- -->
    <script>
        // --- APP DATA ---
        const LEVELS = [
            { id: 1, phase: 1, title: "Level 1: Foundation Reset", tasks: ["Physics: Units & Dimensions (DRDP → 2 hr) + 20 MCQs", "Chemistry: Polymers (0% → 3 hr) + 25 MCQs", "Maths: Sets & Functions (DRDP → 2 hr) + 20 MCQs", "PYQs: 1 hr (10P/10C/10M)", "Revision: 30 min"] },
            { id: 2, phase: 1, title: "Level 2", tasks: ["Physics: Errors (2 hr) + 20 MCQs", "Chemistry: Biomolecules (0% → 3–4 hr) + 25 MCQs", "Maths: Statistics (0% → 3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 3, phase: 1, title: "Level 3", tasks: ["Physics: Kinematics 1D (2.5 hr) + 30 MCQs", "Chemistry: Environmental Chemistry (3 hr) + 20 MCQs", "Maths: Probability (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 4, phase: 1, title: "Level 4", tasks: ["Physics: WEP (2 hr) + 25 MCQs", "Chemistry: Periodic Table (3 hr) + 40 MCQs", "Maths: S&S (2 hr) + 25 MCQs", "PYQs: 1 hr", "Deep Revision: 1 hr (Revise Levels 1–3)"] },
            { id: 5, phase: 1, title: "Level 5", tasks: ["Physics: Current Electricity (2 hr) + 25 MCQs", "Chemistry: Chemical Bonding (3 hr) + 40 MCQs", "Maths: Matrices (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 6, phase: 1, title: "Level 6", tasks: ["Physics: Electrostatics (2 hr) + 25 MCQs", "Chemistry: Mole Concept (2 hr) + 25 MCQs", "Maths: Determinants (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 7, phase: 1, title: "Level 7", tasks: ["Physics: Ray Optics (3–4 hr) + 35 MCQs", "Chemistry: Chemical Kinetics (2 hr) + 25 MCQs", "Maths: Mathematical Reasoning (3 hr)", "PYQs: 1 hr", "Deep Revision: 1 hr (Levels 4–6)"] },
            { id: 8, phase: 1, title: "Level 8", tasks: ["Physics: EM Waves + Communication (3 hr) + 20 MCQs", "Chemistry: Redox (3 hr) + 30 MCQs", "Maths: Binomial (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 9, phase: 1, title: "Level 9", tasks: ["Physics: Magnetism (2 hr) + 25 MCQs", "Chemistry: Surface Chemistry (3 hr) + 25 MCQs", "Maths: P&C (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 10, phase: 1, title: "Level 10: Phase 1 Test", hasTest: true, minScore: 55, maxScore: 90, tasks: ["50-question sectional test (P+M+C)", "Target: 55–60/90", "Deep Revision: 1 hr"] },
            { id: 11, phase: 2, title: "Level 11: Accuracy Building", tasks: ["Physics: Gravitation (0% → 3 hr)", "Chemistry: s-block (3 hr)", "Maths: Quadratic (2.5 hr)", "PYQs 1 hr", "Revision 30 min"] },
            { id: 12, phase: 2, title: "Level 12", tasks: ["Physics: Magnetism Revisit (2 hr)", "Chemistry: p-block selective (3 hr)", "Maths: Limits (2.5 hr)", "MCQs 75 total", "PYQs 1 hr"] },
            { id: 13, phase: 2, title: "Level 13", tasks: ["Physics: Thermodynamics (3 hr)", "Chemistry: Coordination (3 hr)", "Maths: Derivatives (3 hr)", "Revision 30 min"] },
            { id: 14, phase: 2, title: "Level 14", tasks: ["Physics: KTG (2 hr)", "Chemistry: Thermochemistry (2.5 hr)", "Maths: Definite Integrals (3 hr)", "PYQs 1 hr"] },
            { id: 15, phase: 2, title: "Level 15: Mock Test 1", hasTest: true, minScore: 110, maxScore: 300, tasks: ["Full 3-hour mock", "Target: 110+", "Analysis: 1.5 hr", "Revision: 30 min"] },
            { id: 16, phase: 2, title: "Level 16", tasks: ["Physics: Mixed PYQ set (40 questions)", "Chemistry: NCERT revision (1.5 hr)", "Maths: Algebra PYQs (30)", "Revision 30 min"] },
            { id: 17, phase: 2, title: "Level 17", tasks: ["Physics: Electrostatics + Current (mixed practice 50 Qs)", "Chemistry: Inorganic NCERT sweep (2 hr)", "Maths: Sequences (practice day) 40 Q", "PYQs 1 hr"] },
            { id: 18, phase: 2, title: "Level 18", tasks: ["Physics: Optics PYQ day (40 Q)", "Chemistry: Organic basics (3 hr)", "Maths: Vectors + 3D (3 hr)", "Revision 30 min"] },
            { id: 19, phase: 2, title: "Level 19", tasks: ["Physics: WEP + NLM mixed (40 Q)", "Chemistry: Redox + Equilibrium (2 hr)", "Maths: Binomial + P&C mix (40 Q)", "PYQs 1 hr"] },
            { id: 20, phase: 2, title: "Level 20: Mock Test 2", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Full mock", "Target: 120+", "Analysis 1.5 hr"] },
            { id: 21, phase: 3, title: "Level 21: Mock Dominance", tasks: ["Physics: Complete formula revision", "Chemistry: Complete formula revision", "Maths: Complete formula revision", "PYQs 1 hr"] },
            { id: 22, phase: 3, title: "Level 22: Mock Test 3", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Target: 120–130", "Analysis 2 hr"] },
            { id: 23, phase: 3, title: "Level 23", tasks: ["Weak topic repair: 3 hrs", "Mixed 90 MCQs", "Revision 30 min"] },
            { id: 24, phase: 3, title: "Level 24: Mock Test 4", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Analysis 2 hr"] },
            { id: 25, phase: 3, title: "Level 25", tasks: ["Physics: Thermo/KTG revision", "Chemistry: NCERT sprint", "Maths: Calculus sprint", "PYQs 1 hr"] },
            { id: 26, phase: 3, title: "Level 26: Mock Test 5", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Target: 130+", "Analysis 2 hr"] },
            { id: 27, phase: 3, title: "Level 27", tasks: ["Mixed subject practice: 120 Q", "Revision: 45 min"] },
            { id: 28, phase: 3, title: "Level 28: Mock Test 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },
            { id: 29, phase: 3, title: "Level 29", tasks: ["Inorganic NCERT reading", "Maths algebra", "Physics PYQs"] },
            { id: 30, phase: 3, title: "Level 30: Mock Test 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },
            { id: 31, phase: 4, title: "Level 31: Exam Simulation", tasks: ["Full revision of Phase 1 chapters", "PYQs 1 hr"] },
            { id: 32, phase: 4, title: "Level 32: Sim Test 1", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Target: 135+ (Strict 3 hr)"] },
            { id: 33, phase: 4, title: "Level 33", tasks: ["Weak topic grind (90 MCQs)"] },
            { id: 34, phase: 4, title: "Level 34: Sim Test 2", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 2"] },
            { id: 35, phase: 4, title: "Level 35", tasks: ["Complete Maths revision"] },
            { id: 36, phase: 4, title: "Level 36: Sim Test 3", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 3"] },
            { id: 37, phase: 4, title: "Level 37", tasks: ["Physics + Chemistry revision"] },
            { id: 38, phase: 4, title: "Level 38: Sim Test 4", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 4"] },
            { id: 39, phase: 4, title: "Level 39", tasks: ["Final formula revision day"] },
            { id: 40, phase: 4, title: "Level 40: Sim Test 5", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 5"] },
            { id: 41, phase: 5, title: "Level 41: Final Mock 1", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 42, phase: 5, title: "Level 42: Final Mock 2", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 43, phase: 5, title: "Level 43: Final Mock 3", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 44, phase: 5, title: "Level 44: Final Mock 4", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 45, phase: 5, title: "Level 45: Final Mock 5", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 46, phase: 5, title: "Level 46: Final Mock 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 47, phase: 5, title: "Level 47: Final Mock 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 48, phase: 5, title: "Level 48: Final Mock 8", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 49, phase: 5, title: "Level 49: Final Mock 9", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 50, phase: 5, title: "Level 50: Final Mock 10", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
        ];

        // --- APP LOGIC ---
        const app = {
            data: null,
            activeTab: 'dashboard',
            selectedLevel: null,
            testTimer: null,

            init: function() {
                // Load from LocalStorage
                const saved = localStorage.getItem('levelup_jee_local');
                if (saved) {
                    this.data = JSON.parse(saved);
                    this.updateStreak();
                } else {
                    this.data = { currentLevel: 1, xp: 0, streak: 1, lastLogin: new Date().toISOString(), levelProgress: {} };
                    this.save();
                }
                
                this.renderNav();
                this.render();
            },

            save: function() {
                localStorage.setItem('levelup_jee_local', JSON.stringify(this.data));
                this.render(); // Re-render on save
            },

            updateStreak: function() {
                const now = new Date();
                const last = new Date(this.data.lastLogin);
                const diff = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                
                if (diff === 1) this.data.streak++;
                else if (diff > 1) this.data.streak = 1;
                
                this.data.lastLogin = now.toISOString();
                this.save();
            },

            switchTab: function(tab) {
                this.activeTab = tab;
                this.render();
            },

            // --- CLICK HANDLER FOR ALL LEVELS (Unlocked & Locked) ---
            selectLevel: function(id) {
                this.selectedLevel = LEVELS.find(l => l.id === id);
                this.switchTab('level');
            },

            toggleTask: function(idx) {
                const lvlId = this.selectedLevel.id;
                // Prevent toggling if locked
                if (lvlId > this.data.currentLevel) return;

                const key = `level_${lvlId}`;
                if (!this.data.levelProgress[key]) this.data.levelProgress[key] = { tasks: [] };
                
                const tasks = this.data.levelProgress[key].tasks || [];
                // Fill previous
                for(let i=0; i<=idx; i++) if(tasks[i]===undefined) tasks[i] = false;
                
                tasks[idx] = !tasks[idx];
                this.data.levelProgress[key].tasks = tasks;
                this.save();
            },

            completeLevel: function() {
                if (this.selectedLevel.hasTest) {
                    this.startTest();
                } else {
                    const key = `level_${this.selectedLevel.id}`;
                    this.data.levelProgress[key] = { ...this.data.levelProgress[key], completed: true };
                    
                    if (this.data.currentLevel === this.selectedLevel.id) {
                        this.data.currentLevel++;
                        this.data.xp += 100;
                    }
                    this.save();
                    this.showResult(true, "Level Complete!", "Well done.");
                }
            },

            // --- RENDERING ---
            renderNav: function() {
                const items = [
                    {id: 'dashboard', icon: 'activity', label: 'Dashboard'},
                    {id: 'levels', icon: 'book-open', label: 'All Levels'},
                    {id: 'profile', icon: 'user', label: 'My Profile'}
                ];
                
                // Desktop
                document.getElementById('desktop-nav').innerHTML = items.map(i => `
                    <button onclick="app.switchTab('${i.id}')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all mb-1" data-tab="${i.id}">
                        <i data-lucide="${i.icon}" class="w-5 h-5"></i> ${i.label}
                    </button>
                `).join('');

                // Mobile
                document.getElementById('mobile-nav').innerHTML = items.map(i => `
                    <button onclick="app.switchTab('${i.id}')" class="nav-item flex-1 flex flex-col items-center justify-center py-3" data-tab="${i.id}">
                        <i data-lucide="${i.icon}" class="w-6 h-6"></i>
                    </button>
                `).join('');
            },

            render: function() {
                // Update Nav Active State
                document.querySelectorAll('.nav-item').forEach(btn => {
                    const active = btn.dataset.tab === this.activeTab;
                    if (btn.parentElement.id === 'desktop-nav') {
                        btn.className = `nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all mb-1 ${active ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                    } else {
                        btn.className = `nav-item flex-1 flex flex-col items-center justify-center py-3 ${active ? 'text-blue-500' : 'text-slate-500'}`;
                    }
                });

                const content = document.getElementById('app-content');
                if (this.activeTab === 'dashboard') this.renderDashboard(content);
                else if (this.activeTab === 'levels') this.renderLevels(content);
                else if (this.activeTab === 'level') this.renderLevelDetail(content);
                else if (this.activeTab === 'profile') this.renderProfile(content);
                
                lucide.createIcons();
            },

            renderDashboard: function(container) {
                const lvl = LEVELS.find(l => l.id === this.data.currentLevel) || LEVELS[LEVELS.length-1];
                const pct = Math.round((this.data.currentLevel/50)*100);
                
                container.innerHTML = `
                    <div class="space-y-8 animate-fade-in">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden">
                                <div class="absolute right-0 top-0 p-4 opacity-10"><i data-lucide="trophy" class="w-16 h-16"></i></div>
                                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Level</p>
                                <h2 class="text-4xl font-black text-white mt-1">${this.data.currentLevel} <span class="text-lg text-slate-500 font-normal">/ 50</span></h2>
                                <div class="mt-4 h-2 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-blue-500" style="width: ${pct}%"></div></div>
                            </div>
                            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <div class="flex items-center gap-3 mb-2"><i data-lucide="flame" class="text-orange-400 w-5 h-5"></i><span class="text-slate-400 text-sm font-bold uppercase">Streak</span></div>
                                <h2 class="text-4xl font-black text-white">${this.data.streak} <span class="text-sm text-slate-500">Days</span></h2>
                            </div>
                            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <div class="flex items-center gap-3 mb-2"><i data-lucide="activity" class="text-purple-400 w-5 h-5"></i><span class="text-slate-400 text-sm font-bold uppercase">XP</span></div>
                                <h2 class="text-4xl font-black text-white">${this.data.xp}</h2>
                            </div>
                        </div>
                        
                        <div class="bg-gradient-to-r from-blue-900/40 to-slate-800 border border-blue-500/30 p-8 rounded-2xl relative overflow-hidden">
                            <span class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold tracking-widest mb-4">CURRENT MISSION</span>
                            <h1 class="text-3xl font-bold text-white mb-2">${lvl.title}</h1>
                            <button onclick="app.selectLevel(${lvl.id})" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2 transition-all">
                                Continue <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            },

            renderLevels: function(container) {
                const html = LEVELS.map(l => {
                    const locked = l.id > this.data.currentLevel;
                    const current = l.id === this.data.currentLevel;
                    const completed = this.data.levelProgress[`level_${l.id}`]?.completed;
                    
                    let border = locked ? 'border-slate-800 bg-slate-900/50 opacity-70 hover:opacity-100' : (current ? 'border-blue-500 bg-blue-900/10' : 'border-slate-700 bg-slate-800');
                    let icon = completed ? 'check-circle' : (locked ? 'lock' : 'play');
                    let iconColor = completed ? 'text-green-500' : (locked ? 'text-slate-500' : 'text-blue-500');

                    return `
                        <div onclick="app.selectLevel(${l.id})" class="p-4 rounded-lg border ${border} flex items-center justify-between cursor-pointer transition-all mb-3 hover:bg-slate-800">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${current ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'}">${l.id}</div>
                                <div>
                                    <h4 class="font-bold text-white">${l.title}</h4>
                                    <span class="text-xs text-slate-500">Phase ${l.phase}</span>
                                </div>
                            </div>
                            <i data-lucide="${icon}" class="${iconColor} w-5 h-5"></i>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML = `<div class="animate-fade-in"><h2 class="text-2xl font-bold text-white mb-6">All Levels</h2>${html}</div>`;
            },

            renderLevelDetail: function(container) {
                if(!this.selectedLevel) return;
                const l = this.selectedLevel;
                const locked = l.id > this.data.currentLevel;
                const completed = this.data.levelProgress[`level_${l.id}`]?.completed;
                const tasks = this.data.levelProgress[`level_${l.id}`]?.tasks || [];
                const allDone = l.tasks.every((_, i) => tasks[i]);

                const getPhaseColor = (p) => {
                    if(p===1) return 'text-emerald-400 bg-emerald-400/10';
                    if(p===2) return 'text-blue-400 bg-blue-400/10';
                    if(p===3) return 'text-purple-400 bg-purple-400/10';
                    return 'text-orange-400 bg-orange-400/10';
                };

                container.innerHTML = `
                    <div class="max-w-4xl mx-auto animate-slide-in">
                        <button onclick="app.switchTab('dashboard')" class="text-slate-400 hover:text-white mb-4 flex items-center gap-2 text-sm"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                        
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
                            <div class="p-8 border-b border-slate-700">
                                <span class="text-xs font-black tracking-widest px-2 py-1 rounded ${getPhaseColor(l.phase)} mb-3 inline-block">PHASE ${l.phase}</span>
                                <h1 class="text-3xl font-bold text-white">${l.title}</h1>
                            </div>
                            
                            <div class="p-8">
                                ${locked ? `
                                    <div class="bg-red-900/20 border border-red-900/50 p-4 rounded-lg flex items-center gap-3 text-red-200 mb-6">
                                        <i data-lucide="lock" class="w-5 h-5"></i> <span>Finish Level ${this.data.currentLevel} to unlock this content.</span>
                                    </div>
                                ` : ''}

                                <div class="space-y-4">
                                    ${l.tasks.map((t, i) => `
                                        <div class="flex items-start gap-4 p-4 rounded-xl border transition-all ${tasks[i] ? 'bg-blue-900/20 border-blue-500/50' : 'bg-slate-700/20 border-slate-700'}">
                                            <button onclick="app.toggleTask(${i})" ${locked || completed ? 'disabled' : ''} class="mt-1 w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${tasks[i] ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-500 hover:border-blue-400'}">
                                                ${tasks[i] ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                                            </button>
                                            <div class="${tasks[i] ? 'line-through text-slate-500' : 'text-slate-200'}">${t}</div>
                                        </div>
                                    `).join('')}
                                </div>

                                ${!locked && !completed ? `
                                    <div class="mt-8 pt-6 border-t border-slate-700">
                                        <button onclick="app.completeLevel()" ${!allDone ? 'disabled' : ''} class="w-full py-4 rounded-lg font-bold text-lg transition-all ${allDone ? 'bg-green-600 hover:bg-green-500 text-white shadow-lg' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                                            ${l.hasTest ? 'Take Assessment' : 'Complete Level'}
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },

            renderProfile: function(container) {
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto text-center animate-fade-in">
                        <div class="w-24 h-24 bg-slate-800 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-slate-700">
                            <i data-lucide="user" class="text-slate-400 w-12 h-12"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-white mb-1">Student Profile</h2>
                        <p class="text-slate-400 mb-8">Level ${this.data.currentLevel} Scholar</p>
                        
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                                <div class="text-slate-400 text-xs uppercase font-bold mb-1">Completed</div>
                                <div class="text-2xl font-white">${Math.round((this.data.currentLevel/50)*100)}%</div>
                            </div>
                            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                                <div class="text-slate-400 text-xs uppercase font-bold mb-1">Total XP</div>
                                <div class="text-2xl font-white">${this.data.xp}</div>
                            </div>
                        </div>
                        
                        <button onclick="app.resetProgress()" class="text-red-400 text-sm hover:text-red-300 flex items-center justify-center gap-2 mx-auto">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset Data
                        </button>
                    </div>
                `;
            },

            // --- TEST ENGINE ---
            startTest: function() {
                const modal = document.getElementById('test-engine');
                const container = document.getElementById('test-engine');
                const l = this.selectedLevel;
                const count = l.id >= 41 ? 20 : 10;
                
                // Generate questions
                this.testQuestions = Array.from({length: count}, (_, i) => ({
                    id: i, text: `Sample Question ${i+1} for ${l.title}`,
                    options: ['Option A','Option B','Option C','Option D'],
                    correct: Math.floor(Math.random()*4)
                }));
                this.testAnswers = {};
                let timeLeft = l.id >= 15 ? 10800 : 3600;

                // Render
                container.innerHTML = `
                    <div class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
                        <div class="font-bold text-white">${l.title} <span class="text-slate-400 font-normal text-sm ml-2">Test Mode</span></div>
                        <div id="timer-display" class="font-mono text-xl text-yellow-400"></div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full">
                        ${this.testQuestions.map((q, i) => `
                            <div class="mb-6 bg-slate-800 p-4 rounded-lg border border-slate-700">
                                <p class="text-white mb-3 font-medium"><span class="text-slate-400 mr-2">Q${i+1}</span> ${q.text}</p>
                                <div class="grid grid-cols-2 gap-2">
                                    ${q.options.map((o, oid) => `
                                        <button onclick="app.answer(${q.id}, ${oid})" id="q${q.id}-o${oid}" class="p-3 rounded bg-slate-700/50 text-left text-sm hover:bg-slate-700 text-slate-300 transition-colors border border-transparent">
                                            <span class="font-bold mr-2 opacity-50">${String.fromCharCode(65+oid)}</span> ${o}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="h-20 bg-slate-800 border-t border-slate-700 flex items-center justify-between px-6">
                        <button onclick="app.closeTest()" class="text-red-400 text-sm font-bold">Quit</button>
                        <button onclick="app.submitTest()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold">Submit</button>
                    </div>
                `;

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                // Timer
                if(this.testTimer) clearInterval(this.testTimer);
                const updateTimer = () => {
                    const h = Math.floor(timeLeft/3600), m = Math.floor((timeLeft%3600)/60), s = timeLeft%60;
                    document.getElementById('timer-display').textContent = `${h}:${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
                    if(timeLeft-- <= 0) this.submitTest();
                };
                updateTimer();
                this.testTimer = setInterval(updateTimer, 1000);
            },

            answer: function(qid, oid) {
                this.testAnswers[qid] = oid;
                for(let i=0; i<4; i++) {
                    const btn = document.getElementById(`q${qid}-o${i}`);
                    if(i === oid) btn.className = "p-3 rounded bg-blue-600 text-white text-left text-sm border border-blue-400 transition-colors";
                    else btn.className = "p-3 rounded bg-slate-700/50 text-slate-300 text-left text-sm hover:bg-slate-700 border border-transparent transition-colors";
                }
            },

            submitTest: function() {
                clearInterval(this.testTimer);
                let score = 0;
                this.testQuestions.forEach(q => {
                    if(this.testAnswers[q.id] === q.correct) score += 4;
                });
                
                const max = this.selectedLevel.maxScore || 100;
                const finalScore = Math.max(0, Math.round((score / (this.testQuestions.length * 4)) * max));
                const passed = finalScore >= this.selectedLevel.minScore;

                document.getElementById('test-engine').classList.add('hidden');
                document.getElementById('test-engine').classList.remove('flex');

                if (passed) {
                    const key = `level_${this.selectedLevel.id}`;
                    this.data.levelProgress[key] = { completed: true, score: finalScore };
                    this.data.currentLevel++;
                    this.data.xp += (500 + finalScore);
                    this.save();
                    this.showResult(true, `Score: ${finalScore}`, "Level Cleared!");
                } else {
                    this.showResult(false, `Score: ${finalScore}`, `Required: ${this.selectedLevel.minScore}`);
                }
            },

            closeTest: function() {
                clearInterval(this.testTimer);
                document.getElementById('test-engine').classList.add('hidden');
                document.getElementById('test-engine').classList.remove('flex');
            },

            showResult: function(success, title, desc) {
                const m = document.getElementById('result-modal');
                const icon = document.getElementById('result-icon');
                icon.innerHTML = `<i data-lucide="${success ? 'trophy' : 'alert-circle'}" class="w-10 h-10"></i>`;
                icon.className = `w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 ${success ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`;
                document.getElementById('result-msg').innerText = title;
                document.getElementById('result-desc').innerText = desc;
                m.classList.remove('hidden');
                lucide.createIcons();
            },

            closeResult: function() {
                document.getElementById('result-modal').classList.add('hidden');
                this.render();
            },

            resetProgress: function() {
                if(confirm("Reset all data?")) {
                    localStorage.removeItem('levelup_jee_local');
                    location.reload();
                }
            }
        };

        // Start
        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
