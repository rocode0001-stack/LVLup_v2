    <!-- Custom Styles -->

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-blue-500/30 flex flex-col md:flex-row">

    <!-- --- BOTTOM NAV (Mobile) --- -->

    </nav>

    <!-- --- MAIN CONTENT --- -->
    <main class="flex-1 md:ml-64 p-4 pb-24 md:p-8 max-w-7xl mx-auto w-full relative min-h-screen">
        <div id="app-content">
            <!-- Dynamic Content Injected Here -->
            <div class="flex items-center justify-center h-[80vh] text-slate-400">
                <div class="flex flex-col items-center gap-4">

                    <p>Syncing Application Data...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- --- TEST ENGINE MODAL --- -->
    <div id="test-engine" class="fixed inset-0 z-50 bg-slate-900 hidden flex-col animate-fade-in">
        <div class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
            <div class="font-bold text-xl text-white flex flex-col sm:flex-row sm:items-center">

        </div>

            <!-- Questions -->
        </div>
        <div class="h-20 bg-slate-800 border-t border-slate-700 flex items-center justify-between px-6">

            </button>
            <div class="flex items-center gap-4">

                <button id="test-submit" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg font-bold transition-colors">

    <!-- --- RESULT MODAL --- -->

            <h2 id="result-msg" class="text-2xl font-bold text-white mb-2"></h2>
            <p id="result-desc" class="text-slate-400 mb-8"></p>
            <button id="result-close" class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-slate-200 transition-colors">Continue</button>
        </div>
    </div>

    <!-- --- JAVASCRIPT LOGIC --- -->
    <script type="module">

        // --- FIREBASE CONFIGURATION ---
        // In a real deployment, replace this block with your actual Firebase Config keys
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {}; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- CURRICULUM DATA (Exact 50 Levels) ---
        const LEVELS = [
            { id: 1, phase: 1, title: "Level 1: Foundation Reset", tasks: ["Physics: Units & Dimensions (DRDP → 2 hr) + 20 MCQs", "Chemistry: Polymers (0% → 3 hr) + 25 MCQs", "Maths: Sets & Functions (DRDP → 2 hr) + 20 MCQs", "PYQs: 1 hr (10P/10C/10M)", "Revision: 30 min"] },

            { id: 3, phase: 1, title: "Level 3", tasks: ["Physics: Kinematics 1D (2.5 hr) + 30 MCQs", "Chemistry: Environmental Chemistry (3 hr) + 20 MCQs", "Maths: Probability (3 hr) + 20 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 4, phase: 1, title: "Level 4", tasks: ["Physics: WEP (2 hr) + 25 MCQs", "Chemistry: Periodic Table (3 hr) + 40 MCQs", "Maths: S&S (2 hr) + 25 MCQs", "PYQs: 1 hr", "Deep Revision: 1 hr (Revise Levels 1–3)"] },
            { id: 5, phase: 1, title: "Level 5", tasks: ["Physics: Current Electricity (2 hr) + 25 MCQs", "Chemistry: Chemical Bonding (3 hr) + 40 MCQs", "Maths: Matrices (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },
            { id: 6, phase: 1, title: "Level 6", tasks: ["Physics: Electrostatics (2 hr) + 25 MCQs", "Chemistry: Mole Concept (2 hr) + 25 MCQs", "Maths: Determinants (2 hr) + 25 MCQs", "PYQs: 1 hr", "Revision: 30 min"] },

            { id: 10, phase: 1, title: "Level 10: Phase 1 Test", hasTest: true, minScore: 55, maxScore: 90, tasks: ["50-question sectional test (P+M+C)", "Target: 55–60/90", "Deep Revision: 1 hr"] },
            { id: 11, phase: 2, title: "Level 11: Accuracy Building", tasks: ["Physics: Gravitation (0% → 3 hr)", "Chemistry: s-block (3 hr)", "Maths: Quadratic (2.5 hr)", "PYQs 1 hr", "Revision 30 min"] },

            { id: 13, phase: 2, title: "Level 13", tasks: ["Physics: Thermodynamics (3 hr)", "Chemistry: Coordination (3 hr)", "Maths: Derivatives (3 hr)", "Revision 30 min"] },

            { id: 19, phase: 2, title: "Level 19", tasks: ["Physics: WEP + NLM mixed (40 Q)", "Chemistry: Redox + Equilibrium (2 hr)", "Maths: Binomial + P&C mix (40 Q)", "PYQs 1 hr"] },
            { id: 20, phase: 2, title: "Level 20: Mock Test 2", hasTest: true, minScore: 120, maxScore: 300, tasks: ["Full mock", "Target: 120+", "Analysis 1.5 hr"] },
            { id: 21, phase: 3, title: "Level 21: Mock Dominance", tasks: ["Physics: Complete formula revision", "Chemistry: Complete formula revision", "Maths: Complete formula revision", "PYQs 1 hr"] },

            { id: 27, phase: 3, title: "Level 27", tasks: ["Mixed subject practice: 120 Q", "Revision: 45 min"] },
            { id: 28, phase: 3, title: "Level 28: Mock Test 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },
            { id: 29, phase: 3, title: "Level 29", tasks: ["Inorganic NCERT reading", "Maths algebra", "Physics PYQs"] },
            { id: 30, phase: 3, title: "Level 30: Mock Test 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Analysis"] },
            { id: 31, phase: 4, title: "Level 31: Exam Simulation", tasks: ["Full revision of Phase 1 chapters", "PYQs 1 hr"] },
            { id: 32, phase: 4, title: "Level 32: Sim Test 1", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Target: 135+ (Strict 3 hr)"] },
            { id: 33, phase: 4, title: "Level 33", tasks: ["Weak topic grind (90 MCQs)"] },
            { id: 34, phase: 4, title: "Level 34: Sim Test 2", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 2"] },
            { id: 35, phase: 4, title: "Level 35", tasks: ["Complete Maths revision"] },
            { id: 36, phase: 4, title: "Level 36: Sim Test 3", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 3"] },
            { id: 37, phase: 4, title: "Level 37", tasks: ["Physics + Chemistry revision"] },
            { id: 38, phase: 4, title: "Level 38: Sim Test 4", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 4"] },
            { id: 39, phase: 4, title: "Level 39", tasks: ["Final formula revision day"] },
            { id: 40, phase: 4, title: "Level 40: Sim Test 5", hasTest: true, minScore: 135, maxScore: 300, tasks: ["Simulation Test 5"] },
            { id: 41, phase: 5, title: "Level 41: Final Mock 1", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 42, phase: 5, title: "Level 42: Final Mock 2", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 43, phase: 5, title: "Level 43: Final Mock 3", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 44, phase: 5, title: "Level 44: Final Mock 4", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 45, phase: 5, title: "Level 45: Final Mock 5", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 46, phase: 5, title: "Level 46: Final Mock 6", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 47, phase: 5, title: "Level 47: Final Mock 7", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 48, phase: 5, title: "Level 48: Final Mock 8", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 49, phase: 5, title: "Level 49: Final Mock 9", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
            { id: 50, phase: 5, title: "Level 50: Final Mock 10", hasTest: true, minScore: 130, maxScore: 300, tasks: ["Full Mock Test", "Autosubmit ON", "Analytics ON", "Min Score: 130+"] },
        ];

        // --- GLOBAL STATE ---
        let currentUser = null;
        let userData = null;
        let activeTab = 'dashboard';
        let selectedLevel = null;
        let testInterval = null;

        // --- DOM ELEMENTS ---
        const navItems = [
            { id: 'dashboard', icon: 'activity', label: 'Dashboard' },
            { id: 'levels', icon: 'book-open', label: 'All Levels' },
            { id: 'profile', icon: 'user', label: 'My Profile' },
        ];
        
        const appContent = document.getElementById('app-content');
        const desktopNav = document.getElementById('desktop-nav');
        const mobileNav = document.getElementById('mobile-nav');

        // --- HELPERS ---
        const getPhaseColor = (phase) => {
            switch(phase) {
                case 1: return "text-emerald-400 border-emerald-400/20 bg-emerald-400/10";
                case 2: return "text-blue-400 border-blue-400/20 bg-blue-400/10";
                case 3: return "text-purple-400 border-purple-400/20 bg-purple-400/10";
                case 4: return "text-orange-400 border-orange-400/20 bg-orange-400/10";
                case 5: return "text-red-400 border-red-400/20 bg-red-400/10";
                default: return "text-gray-400";
            }
        };

        // --- INIT APP ---
        async function init() {
            renderNav();
            
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    document.getElementById('user-uid').textContent = `UID: ${user.uid.slice(0, 6)}...`;
                    document.getElementById('user-type').textContent = user.isAnonymous ? 'Guest Student' : 'Student';
                    document.getElementById('user-avatar').textContent = user.isAnonymous ? 'GS' : 'ST';
                    
                    const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'profile');
                    onSnapshot(userRef, handleUserDataSync);
                }
            });
        }

        // --- SYNC LOGIC ---
        async function handleUserDataSync(docSnap) {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // Streak Logic
                const now = new Date();
                const lastLogin = data.lastLogin?.toDate();
                let newStreak = data.streak || 0;
                let shouldUpdate = false;

                if (lastLogin) {
                    const diffTime = Math.abs(now - lastLogin);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    if (diffDays === 1 && now.getDate() !== lastLogin.getDate()) {
                        newStreak += 1; shouldUpdate = true;
                    } else if (diffDays > 1) {
                        newStreak = 1; shouldUpdate = true;
                    }
                } else {
                    newStreak = 1; shouldUpdate = true;
                }

                if (shouldUpdate) {
                    await updateDoc(docSnap.ref, { streak: newStreak, lastLogin: serverTimestamp() });
                }

                userData = data;
            } else {
                // Create New User
                const initialData = {
                    currentLevel: 1, xp: 0, streak: 1, lastLogin: serverTimestamp(), levelProgress: {} 
                };
                await setDoc(docSnap.ref, initialData);
                userData = initialData;
            }
            renderApp();
        }

        // --- RENDERING ---
        function renderNav() {
            const dHtml = navItems.map(item => `
                <button onclick="window.switchTab('${item.id}')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all text-slate-400 hover:bg-slate-800 hover:text-white" data-tab="${item.id}">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i> <span>${item.label}</span>
                </button>
            `).join('');
            desktopNav.innerHTML = dHtml;

            const mHtml = navItems.map(item => `
                <button onclick="window.switchTab('${item.id}')" class="nav-btn flex-1 flex flex-col items-center justify-center py-3 text-slate-500" data-tab="${item.id}">
                    <i data-lucide="${item.icon}" class="w-6 h-6"></i>
                </button>
            `).join('');
            mobileNav.innerHTML = mHtml;
            lucide.createIcons();
        }

        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isActive = btn.dataset.tab === activeTab;
                if (btn.parentElement.id === 'desktop-nav') {
                    btn.className = `nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all ${isActive ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                } else {
                    btn.className = `nav-btn flex-1 flex flex-col items-center justify-center py-3 ${isActive ? 'text-blue-500' : 'text-slate-500'}`;
                }
            });
        }

        function renderApp() {
            updateNavStyles();
            if (!userData) return;

            switch(activeTab) {
                case 'dashboard': renderDashboard(); break;
                case 'levels': renderLevelsList(); break;
                case 'profile': renderProfile(); break;
                case 'level': renderLevelDetail(); break;
            }
            lucide.createIcons();
        }

        // -- VIEW: DASHBOARD --
        function renderDashboard() {
            const currentLvl = LEVELS.find(l => l.id === userData.currentLevel) || LEVELS[LEVELS.length-1];
            const percent = (userData.currentLevel / 50) * 100;
            const estPercentile = userData.currentLevel > 10 ? (80 + (userData.currentLevel * 0.3)).toFixed(1) : "Calc...";

            appContent.innerHTML = `
                <div class="space-y-8 animate-fade-in">
                    <!-- Stats -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 p-4 opacity-10"><i data-lucide="trophy" class="w-16 h-16"></i></div>
                            <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Current Level</p>
                            <h2 class="text-4xl font-black text-white mt-1">${userData.currentLevel} <span class="text-lg text-slate-500 font-normal">/ 50</span></h2>
                            <div class="mt-4 h-2 bg-slate-700 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                            <div class="flex items-center gap-3 mb-2">
                                <i data-lucide="flame" class="text-orange-400 w-5 h-5"></i>
                                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Streak</p>
                            </div>
                            <h2 class="text-4xl font-black text-white">${userData.streak || 0} <span class="text-sm text-slate-500 font-normal">Days</span></h2>
                        </div>
                         <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                            <div class="flex items-center gap-3 mb-2">
                                <i data-lucide="bar-chart-2" class="text-green-400 w-5 h-5"></i>
                                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Est. Percentile</p>
                            </div>
                            <h2 class="text-4xl font-black text-white">${estPercentile}</h2>
                        </div>
                    </div>

                    <!-- Active Mission -->
                    <div class="bg-gradient-to-r from-blue-900/40 to-slate-800 border border-blue-500/30 p-8 rounded-2xl relative overflow-hidden">
                        <div class="relative z-10">
                            <span class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold tracking-widest mb-4">ACTIVE MISSION</span>
                            <h1 class="text-3xl font-bold text-white mb-2">${currentLvl.title}</h1>
                            <p class="text-slate-400 max-w-2xl mb-6">${currentLvl.hasTest ? "Mandatory assessment required." : "Complete tasks to advance."}</p>
                            <button onclick="window.selectLevel(${currentLvl.id})" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-blue-900/50 transition-all transform hover:-translate-y-1">
                                Continue Level <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Up Next -->
                    <div>
                         <h3 class="text-white font-bold text-lg mb-4">Up Next</h3>
                         <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${LEVELS.slice(userData.currentLevel, userData.currentLevel + 4).map(lvl => `
                                <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-lg opacity-70">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-xs font-bold text-slate-500">LEVEL ${lvl.id}</span>
                                        <i data-lucide="lock" class="text-slate-600 w-3 h-3"></i>
                                    </div>
                                    <p class="text-slate-300 text-sm font-medium truncate">${lvl.title}</p>
                                </div>
                            `).join('')}
                         </div>
                    </div>
                </div>
            `;
        }

        // -- VIEW: LEVEL LIST --
        function renderLevelsList() {
            appContent.innerHTML = `
                <div class="grid gap-4 animate-fade-in">
                    <h2 class="text-2xl font-bold text-white mb-4">Curriculum Map</h2>
                    ${LEVELS.map(l => {
                        const isUnlocked = l.id <= userData.currentLevel;
                        const isCurrent = l.id === userData.currentLevel;
                        const isCompleted = userData.levelProgress?.[`level_${l.id}`]?.completed;
                        
                        let statusIcon = isCompleted ? 'check-circle' : (!isUnlocked ? 'lock' : 'chevron-right');
                        let statusColor = isCompleted ? 'text-green-500' : 'text-slate-600';
                        let badgeClass = isCompleted ? 'bg-green-500/20 text-green-400' : (isCurrent ? 'bg-blue-500 text-white' : 'bg-slate-700 text-slate-400');
                        let borderClass = isCurrent ? 'bg-blue-900/20 border-blue-500 ring-1 ring-blue-500' : (isUnlocked ? 'bg-slate-800 border-slate-700 hover:border-slate-600' : 'bg-slate-900 border-slate-800 opacity-75 cursor-pointer hover:border-slate-700');

                        return `
                            <div onclick="window.selectLevel(${l.id})" class="p-4 rounded-lg border flex items-center justify-between cursor-pointer transition-all ${borderClass}">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${badgeClass}">${l.id}</div>
                                    <div>
                                        <h4 class="font-bold ${isUnlocked ? 'text-white' : 'text-slate-500'}">${l.title}</h4>
                                        <span class="text-xs px-2 py-0.5 rounded ${getPhaseColor(l.phase)}">Phase ${l.phase}</span>
                                    </div>
                                </div>
                                <i data-lucide="${statusIcon}" class="${statusColor} w-5 h-5"></i>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // -- VIEW: LEVEL DETAIL --
        function renderLevelDetail() {
            if (!selectedLevel) return;
            const levelKey = `level_${selectedLevel.id}`;
            const progress = userData.levelProgress?.[levelKey] || {};
            const tasksCompleted = progress.tasks || [];
            const allTasksDone = selectedLevel.tasks.every((_, i) => tasksCompleted[i]);
            const isLocked = selectedLevel.id > userData.currentLevel;
            const isCompleted = progress.completed;
            const phaseColor = getPhaseColor(selectedLevel.phase);

            appContent.innerHTML = `
                <div class="max-w-4xl mx-auto animate-slide-in">
                    <button onclick="window.switchTab('dashboard')" class="text-slate-400 hover:text-white mb-4 flex items-center gap-2 text-sm">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                    </button>
                    
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
                        <div class="p-8 border-b border-slate-700 ${phaseColor} bg-opacity-5">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-xs font-black tracking-widest px-2 py-1 rounded bg-slate-900/50 mb-3 inline-block ${phaseColor}">PHASE ${selectedLevel.phase}</span>
                                    <h1 class="text-3xl font-bold text-white">${selectedLevel.title}</h1>
                                </div>
                                ${isCompleted ? '<div class="bg-green-500/20 text-green-400 px-4 py-2 rounded-full flex items-center gap-2 font-bold"><i data-lucide="check-circle" class="w-5 h-5"></i> Completed</div>' : ''}
                            </div>
                        </div>

                        <div class="p-8">
                            ${isLocked && !isCompleted ? `
                                <div class="bg-red-900/20 border border-red-900/50 p-4 rounded-lg flex items-center gap-3 text-red-200 mb-6">
                                    <i data-lucide="lock" class="w-5 h-5"></i> <span>Finish Level ${userData.currentLevel} first.</span>
                                </div>
                            ` : ''}

                            <div class="space-y-4">
                                ${selectedLevel.tasks.map((task, i) => {
                                    const isChecked = tasksCompleted[i];
                                    const btnClass = isChecked ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-500 text-transparent hover:border-blue-400';
                                    const txtClass = isChecked ? 'opacity-50 line-through text-slate-400' : 'text-slate-200';
                                    const disabled = isLocked || isCompleted ? 'disabled' : '';
                                    
                                    return `
                                        <div class="flex items-start gap-4 p-4 rounded-xl border transition-all ${isChecked ? 'bg-slate-700/30 border-slate-600' : 'bg-slate-700/10 border-slate-700 hover:bg-slate-700/30'}">
                                            <button ${disabled} onclick="window.toggleTask(${selectedLevel.id}, ${i})" class="mt-1 w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${btnClass}">
                                                <i data-lucide="check" class="w-3 h-3 font-bold"></i>
                                            </button>
                                            <div class="${txtClass}">${task}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            ${!isCompleted && !isLocked ? `
                                <div class="mt-8 border-t border-slate-700 pt-6">
                                    ${selectedLevel.hasTest ? `
                                        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                                            <div class="flex items-center gap-4 mb-4">
                                                <i data-lucide="clock" class="text-yellow-500 w-6 h-6"></i>
                                                <div>
                                                    <h4 class="text-white font-bold">Mandatory Level Assessment</h4>
                                                    <p class="text-slate-400 text-sm">Min Score: ${selectedLevel.minScore} / ${selectedLevel.maxScore || 300}</p>
                                                </div>
                                            </div>
                                            <button onclick="window.completeLevel()" ${!allTasksDone ? 'disabled' : ''} class="w-full py-3 rounded-lg font-bold transition-all ${allTasksDone ? 'bg-yellow-500 hover:bg-yellow-400 text-black' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                                                ${allTasksDone ? "Start Assessment" : "Complete Tasks to Unlock Test"}
                                            </button>
                                        </div>
                                    ` : `
                                        <button onclick="window.completeLevel()" ${!allTasksDone ? 'disabled' : ''} class="w-full py-4 rounded-lg font-bold text-lg transition-all ${allTasksDone ? 'bg-green-600 hover:bg-green-500 text-white shadow-lg shadow-green-900/20' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                                            ${allTasksDone ? "Complete Level" : "Complete All Tasks to Finish"}
                                        </button>
                                    `}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // -- VIEW: PROFILE --
        function renderProfile() {
            const percent = Math.round((userData.currentLevel / 50) * 100);
            const history = Object.entries(userData.levelProgress || {})
                .map(([k, v]) => ({...v, levelId: parseInt(k.split('_')[1]), title: LEVELS.find(l => l.id === parseInt(k.split('_')[1]))?.title }))
                .filter(l => l.score !== undefined)
                .sort((a,b) => b.levelId - a.levelId);

            appContent.innerHTML = `
                <div class="max-w-2xl mx-auto animate-fade-in">
                    <div class="text-center mb-8">
                        <div class="w-24 h-24 bg-slate-800 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-slate-700">
                            <i data-lucide="user" class="text-slate-400 w-12 h-12"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-white">Student Profile</h2>
                        <p class="text-slate-400">Level ${userData.currentLevel} Scholar</p>
                    </div>
                    
                    <div class="bg-slate-800 rounded-xl p-6 mb-6 border border-slate-700">
                        <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-5 h-5"></i> Overall Progress</h3>
                        <div class="flex justify-between mb-2 text-sm text-slate-400"><span>Completion</span><span>${percent}%</span></div>
                        <div class="h-4 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-blue-500 transition-all" style="width: ${percent}%"></div></div>
                    </div>

                    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8">
                        <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="history" class="w-5 h-5"></i> Assessment History</h3>
                        ${history.length === 0 ? '<p class="text-slate-500 text-center">No assessments completed yet.</p>' : 
                        `<div class="space-y-3">${history.map(h => `
                            <div class="flex justify-between items-center p-3 bg-slate-700/30 rounded">
                                <span class="text-sm font-medium">${h.title}</span>
                                <span class="text-sm font-bold ${h.score >= (LEVELS.find(l=>l.id===h.levelId).minScore) ? 'text-green-400' : 'text-red-400'}">${h.score} Marks</span>
                            </div>
                        `).join('')}</div>`}
                    </div>

                    <div class="border-t border-slate-800 pt-6 text-center">
                        <button onclick="window.resetProgress()" class="bg-red-900/20 text-red-400 border border-red-900/50 px-4 py-2 rounded text-sm hover:bg-red-900/40 transition-colors flex items-center gap-2 mx-auto">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset All Progress
                        </button>
                    </div>
                </div>
            `;
        }

        // --- ACTIONS & LOGIC ---
        window.switchTab = (tab) => {
            activeTab = tab;
            renderApp();
        };

        window.selectLevel = (id) => {
            selectedLevel = LEVELS.find(l => l.id === id);
            window.switchTab('level');
        };

        window.toggleTask = async (levelId, idx) => {
            const levelKey = `level_${levelId}`;
            const currentProgress = userData.levelProgress?.[levelKey] || {};
            const currentTasks = currentProgress.tasks || [];
            
            // Fill logic
            const newTasks = [...currentTasks];
            for(let i=0; i<=idx; i++) if(newTasks[i] === undefined) newTasks[i] = false;
            newTasks[idx] = !newTasks[idx];

            // Optimistic UI update
            userData.levelProgress = { ...userData.levelProgress, [levelKey]: { ...currentProgress, tasks: newTasks }};
            renderLevelDetail();
            lucide.createIcons();

            await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'profile'), {
                [`levelProgress.${levelKey}.tasks`]: newTasks
            });
        };

        window.completeLevel = async () => {
            if (selectedLevel.hasTest) {
                startTest();
            } else {
                // Direct Complete
                const levelKey = `level_${selectedLevel.id}`;
                const updates = {
                    [`levelProgress.${levelKey}.completed`]: true,
                    currentLevel: userData.currentLevel === selectedLevel.id ? selectedLevel.id + 1 : userData.currentLevel,
                    xp: (userData.xp || 0) + 100
                };
                await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'profile'), updates);
                showResultModal(true, "Level Complete!", "Great job keeping up with the schedule.");
            }
        };

        window.resetProgress = async () => {
            if (!confirm("Are you sure? This will wipe all progress.")) return;
            const initialData = { currentLevel: 1, xp: 0, streak: 1, lastLogin: serverTimestamp(), levelProgress: {} };
            await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'profile'), initialData);
            window.location.reload();
        };

        // --- TEST ENGINE ---
        let testAnswers = {};
        let testQuestions = [];
        let testTime = 0;

        function startTest() {
            const modal = document.getElementById('test-engine');
            const count = selectedLevel.id >= 41 ? 20 : 10;
            testQuestions = Array.from({length: count}, (_,i) => ({
                id: i, text: `Sample Question ${i+1} for ${selectedLevel.title}`,
                options: ['Option A','Option B','Option C','Option D'], correct: Math.floor(Math.random()*4)
            }));
            testAnswers = {};
            testTime = selectedLevel.id >= 15 ? 10800 : 3600;

            // Render Questions
            document.getElementById('test-title').textContent = selectedLevel.title;
            const qContainer = document.getElementById('test-questions');
            qContainer.innerHTML = testQuestions.map((q, i) => `
                <div class="mb-6 bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <div class="flex items-start gap-3 mb-3">
                        <span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-sm">Q${i+1}</span>
                        <p class="text-slate-200 font-medium">${q.text}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-10">
                        ${q.options.map((opt, oid) => `
                            <button onclick="window.answerQuestion(${q.id}, ${oid})" id="btn-${q.id}-${oid}" class="opt-btn text-left px-4 py-3 rounded-md bg-slate-700 text-slate-300 hover:bg-slate-600 transition-colors">
                                <span class="font-bold mr-2 opacity-50">${String.fromCharCode(65+oid)}.</span> ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Timer
            if (testInterval) clearInterval(testInterval);
            testInterval = setInterval(() => {
                testTime--;
                const h = Math.floor(testTime/3600), m = Math.floor((testTime%3600)/60), s = testTime%60;
                document.getElementById('test-timer').textContent = `${h}:${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
                if (testTime <= 0) window.submitTest();
            }, 1000);

            document.getElementById('test-quit').onclick = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                clearInterval(testInterval);
            };
            document.getElementById('test-submit').onclick = window.submitTest;
        }

        window.answerQuestion = (qid, oid) => {
            testAnswers[qid] = oid;
            // Visual update
            document.querySelectorAll(`[id^='btn-${qid}-']`).forEach(b => b.className = "opt-btn text-left px-4 py-3 rounded-md bg-slate-700 text-slate-300 hover:bg-slate-600 transition-colors");
            document.getElementById(`btn-${qid}-${oid}`).className = "opt-btn text-left px-4 py-3 rounded-md bg-blue-600 text-white ring-2 ring-blue-400 transition-colors";
            document.getElementById('test-progress').textContent = `Answered: ${Object.keys(testAnswers).length}/${testQuestions.length}`;
        };

        window.submitTest = async () => {
            clearInterval(testInterval);
            document.getElementById('test-engine').classList.add('hidden');
            document.getElementById('test-engine').classList.remove('flex');

            let score = 0;
            testQuestions.forEach(q => {
                if (testAnswers[q.id] === q.correct) score += 4;
                else if (testAnswers[q.id] !== undefined) score -= 1;
            });
            
            const max = selectedLevel.maxScore || 100;
            const finalScore = Math.max(0, Math.round((score / (testQuestions.length * 4)) * max));
            const passed = finalScore >= selectedLevel.minScore;

            if (passed) {
                const levelKey = `level_${selectedLevel.id}`;
                await updateDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'profile'), {
                    [`levelProgress.${levelKey}.completed`]: true,
                    [`levelProgress.${levelKey}.score`]: finalScore,
                    currentLevel: userData.currentLevel === selectedLevel.id ? selectedLevel.id + 1 : userData.currentLevel,
                    xp: (userData.xp || 0) + 500 + finalScore
                });
                showResultModal(true, `Level Cleared! Score: ${finalScore}`, "Excellent work.");
            } else {
                showResultModal(false, `Failed. Score: ${finalScore}`, `Required: ${selectedLevel.minScore}. Try again.`);
            }
        };

        function showResultModal(passed, msg, desc) {
            const modal = document.getElementById('result-modal');
            const icon = document.getElementById('result-icon');
            
            icon.className = `w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 ${passed ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`;
            icon.innerHTML = `<i data-lucide="${passed ? 'trophy' : 'alert-circle'}" class="w-10 h-10"></i>`;
            
            document.getElementById('result-msg').textContent = msg;
            document.getElementById('result-desc').textContent = desc;
            
            modal.classList.remove('hidden');
            lucide.createIcons();
            
            document.getElementById('result-close').onclick = () => {
                modal.classList.add('hidden');
                renderApp();
            };
        }

        document.getElementById('sign-out-btn').addEventListener('click', () => signOut(auth));

        // Start
        init();
    </script>
</body>
</html>
